version: '3.8'

services:
  vomitbin:
    build: .
    ports:
      - "8080:8080"
    environment:
      - MONGODB_HOST=mongodb
    depends_on:
      - mongodb
    networks:
      - vomitbin-network

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=zifbin
    volumes:
      - mongodb_data:/data/db
    networks:
      - vomitbin-network

volumes:
  mongodb_data:

networks:
  vomitbin-network:
    driver: bridge
